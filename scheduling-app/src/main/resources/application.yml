server:
  # HTTP 与机器人 TCP 必须分端口。
  port: 8081

kunling:
  workflow:
    order-sync:
      enabled: true
      fixed-delay-ms: 10000
      page-size: 100
      overlap: 1m
      # 客户接口确定后填写；为空时定时器使用空实现，不发起HTTP请求。
      # endpoint: https://customer.example.com/api/orders/incremental
      # bearer-token: your-token
      connect-timeout: 5s
      read-timeout: 15s
      sources:
        - MES
  file:
    # 开发期地图图片写入 scheduling-app 模块源码资源目录。
    storage-directory: scheduling-app/src/main/resources/file
  action:
    robot-bridge:
      # 下游在此地址监听，上游机器人客户端主动连接该地址与端口。
      enabled: true
      bind-address: 0.0.0.0
      port: 8080

spring:
  application:
    name: kunling-scheduling
  web:
    resources:
      cache:
        cachecontrol:
          # Action 工作台处于高频联调阶段，禁止浏览器继续执行旧版静态脚本。
          no-store: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://39.105.68.15:50013/kunling?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: sunder
    password: "123456qwertQ"
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 5s
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

flowable:
  database-schema-update: true
  async-executor-activate: true
  history-level: audit

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn
