server:
  # HTTP 与机器人 TCP 必须分端口。
  port: 8081

kunling:
  action:
    robot-bridge:
      # 下游在此地址监听，上游机器人客户端主动连接该地址与端口。
      enabled: true
      bind-address: 0.0.0.0
      port: 8080

spring:
  application:
    name: kunling-scheduling
  web:
    resources:
      cache:
        cachecontrol:
          # Action 工作台处于高频联调阶段，禁止浏览器继续执行旧版静态脚本。
          no-store: true
  datasource:
    url: jdbc:mysql://39.105.68.15:50013/kunling?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: sunder
    password: "123456qwertQ"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

flowable:
  database-schema-update: true
  async-executor-activate: true
  history-level: audit

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn
