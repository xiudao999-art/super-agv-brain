server:
  # HTTP 与机器人 TCP 必须分端口。
  port: 8081


kunling:
  workflow:
    order-sync:
      enabled: true
      fixed-delay-ms: 60000
      page-size: 100
      overlap: 1m
      # 客户接口确定后填写；为空时定时器使用空实现，不发起HTTP请求。
      # endpoint: https://customer.example.com/api/orders/incremental
      # bearer-token: your-token
      connect-timeout: 5s
      read-timeout: 15s
      sources:
        - MES
  file:
    # 开发期地图图片写入 scheduling-app 模块源码资源目录。
    storage-directory: scheduling-app/src/main/resources/file
  action:
    robot-bridge:
      # 下游在此地址监听，上游机器人客户端主动连接该地址与端口。
      enabled: true
      bind-address: 0.0.0.0
      port: 8080
      # 演示环境的工作流会同步模拟最长 120 秒延时；临时放宽两端心跳判定窗口。
      # 客户端使用服务端下发的心跳周期，连续 3 个周期无 PONG 才会重连。
      heartbeat-interval-ms: 60000
      lease-ms: 240000

spring:
  application:
    name: kunling-scheduling
  profiles:
    # 当前固定使用开发环境；仍可通过--spring.profiles.active=prod覆盖。
    active: dev
  web:
    resources:
      cache:
        cachecontrol:
          # Action 工作台处于高频联调阶段，禁止浏览器继续执行旧版静态脚本。
          no-store: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MySQL8Dialect

flowable:
  database-schema-update: false
  async-executor-activate: true
  history-level: audit

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

