<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>坤灵 Action 子动作编排</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="action-execution-timeline.css">
</head>
<body>
  <header class="topbar">
    <div><strong>坤灵 Action 工作台</strong><small>子动作编排 · 整包下发 · 执行证据</small></div>
    <div class="actions">
      <span id="connectionState" class="badge">正在连接</span>
      <button id="newActionButton" class="secondary">新建 Action</button>
      <button id="saveActionButton">保存</button>
      <button id="enableButton" class="primary">启用</button>
    </div>
  </header>

  <div id="lockBanner" class="lock-banner" hidden>
    当前 Action 正在执行，定义暂时不可编辑；终态到达后自动解锁。
  </div>

  <main>
    <section class="panel definition-panel">
      <div class="section-title"><span>01</span><div><h2>Action 定义</h2><p>定义只保存名称、超时和有序步骤</p></div></div>
      <label>选择 Action<select id="actionSelect"></select></label>
      <div class="grid two">
        <label>Action 名称<input id="actionName" data-editable></label>
        <label>超时（ms）<input id="timeoutMs" type="number" min="1000" max="3600000" data-editable></label>
        <label>在线机器人<select id="robotSelect"></select></label>
      </div>
      <div class="meta"><span id="actionEnabled" class="badge">未启用</span><span id="actionId">ID -</span></div>
    </section>

    <section class="panel step-panel">
      <div class="section-title"><span>02</span><div><h2>执行步骤</h2><p>数组顺序即执行顺序，固定参数直接保存在 params</p></div></div>
      <div id="stepList" class="step-list"></div>
      <button id="addStepButton" class="dashed" data-editable>＋ 添加执行步骤</button>
    </section>

    <section class="panel commissioning-panel">
      <div class="section-title"><span>03</span><div><h2>动作包联调</h2><p>按在线机器人能力校验，确认后一次下发</p></div></div>
      <div class="execute-actions">
        <button id="previewButton" data-editable>生成预览</button>
        <button id="executeButton" class="danger" disabled>模拟执行</button>
      </div>
      <div id="previewMeta" class="preview-meta"></div>
      <pre id="packagePreview" class="package-preview">尚未生成预览</pre>
      <section class="execution-card">
        <h3>执行记录</h3>
        <div id="executionSummary" class="empty">当前 Action 尚未执行</div>
        <div id="stepTimeline" class="timeline"></div>
      </section>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script src="action-workbench-state.js"></script>
  <script src="action-execution-timeline.js"></script>
  <script src="app.js"></script>
</body>
</html>
