<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>坤灵 Action 配置与设备联调</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="action-execution-timeline.css">
</head>
<body>
  <header class="topbar">
    <div><strong>坤灵 Action 工作台</strong><small>动态组包 · 整包下发 · 执行快照</small></div>
    <div class="actions">
      <span id="connectionState" class="badge">正在连接</span>
      <button id="newActionButton" class="secondary">新建 Action</button>
      <button id="newTaskButton" class="secondary">新建联调任务</button>
      <button id="saveActionButton">保存当前定义</button>
      <button id="activateButton" class="primary">启用</button>
    </div>
  </header>

  <div id="lockBanner" class="lock-banner" hidden>
    当前联调任务正在执行，Action 和设备联调参数暂时冻结；成功或物理结果明确的失败到达后将自动解冻。
  </div>

  <main>
    <section class="panel definition-panel">
      <div class="section-title"><span>01</span><div><h2>Action 定义</h2><p>只维护当前定义，revision 仅用于防止并发覆盖</p></div></div>
      <label>选择 Action<select id="actionSelect"></select></label>
      <div class="grid two">
        <label>Action Key<input id="actionKey" data-editable></label>
        <label>下游动作类型<select id="downstreamActionType" data-editable></select></label>
        <label>显示名称<input id="displayName" data-editable></label>
        <label>超时（ms）<input id="timeoutMs" type="number" min="1" data-editable></label>
      </div>
      <label>说明<textarea id="description" rows="2" data-editable></textarea></label>
      <div class="meta"><span id="actionStatus" class="badge">DRAFT</span><span id="actionRevision">revision -</span></div>
      <details>
        <summary>高级 Schema（JSON）</summary>
        <label>设备联调参数 Schema<textarea id="parameterSchema" class="code" rows="10" data-editable>{}</textarea></label>
      </details>
    </section>

    <section class="panel phase-panel">
      <div class="section-title"><span>02</span><div><h2>执行步骤</h2><p>可拖动思路的显式顺序：允许同一子动作重复 N 次</p></div></div>
      <div id="phaseList" class="phase-list"></div>
      <button id="addPhaseButton" class="dashed" data-editable>＋ 添加执行步骤</button>
    </section>

    <section class="panel commissioning-panel">
      <div class="section-title"><span>03</span><div><h2>设备联调</h2><p>预览最终解析值，确认后一次性冻结并整包下发</p></div></div>
      <div class="grid two">
        <label>机器人 ID<input id="robotId" value="R01" data-task-editable></label>
        <label>联调参数集<select id="parameterSetSelect" data-task-editable></select></label>
        <label>参数集名称<input id="parameterSetName" data-task-editable></label>
        <label>工装 / 物料<input id="fixtureMaterial" placeholder="工装键 / 物料键" data-task-editable></label>
      </div>
      <label>设备联调参数（JSON）<textarea id="parameterValues" class="code" rows="8" data-task-editable>{}</textarea></label>
      <button id="saveParameterSetButton" class="secondary" data-task-editable>保存参数集</button>
      <div class="execute-actions">
        <button id="previewButton" data-task-editable>生成最终预览</button>
        <button id="executeButton" class="danger" disabled>确认并执行整包</button>
      </div>
      <div id="previewMeta" class="preview-meta"></div>
      <pre id="packagePreview" class="package-preview">尚未生成预览</pre>
      <section class="execution-card">
        <h3>执行记录</h3>
        <div id="executionSummary" class="empty">当前联调任务尚未执行</div>
        <button id="releaseUnknownHoldButton" class="secondary" hidden>
          调试解冻（保留 UNKNOWN_HOLD 记录）
        </button>
        <div id="stepTimeline" class="timeline"></div>
      </section>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script src="action-workbench-state.js"></script>
  <script src="action-execution-timeline.js"></script>
  <script src="app.js"></script>
</body>
</html>
