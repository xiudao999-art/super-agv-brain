upstream kunling_backend {
    server backend:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://kunling_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # scheduling-app 中暂未统一增加 /api 前缀的管理接口。
    location ~ ^/(locations|locationTypes|carriers|carrierTypes|nodeRules)(/|$) {
        proxy_pass http://kunling_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /files/ {
        proxy_pass http://kunling_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v3/api-docs {
        proxy_pass http://kunling_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /doc.html {
        proxy_pass http://kunling_backend;
        proxy_set_header Host $host;
    }

    location /webjars/ {
        proxy_pass http://kunling_backend;
        proxy_set_header Host $host;
    }

    location /swagger-resources/ {
        proxy_pass http://kunling_backend;
        proxy_set_header Host $host;
    }

    location = /swagger-resources {
        proxy_pass http://kunling_backend;
        proxy_set_header Host $host;
    }

    # 支持 Vue/React BrowserRouter，静态文件不存在时回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
