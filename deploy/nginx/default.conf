upstream kunling_backend {
    server backend:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index robot-dispatch-dashboard.html;
    charset utf-8;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://kunling_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # scheduling-app 中暂未统一增加 /api 前缀的管理接口。
    location ~ ^/(locations|locationTypes|carriers|carrierTypes|nodeRules)(/|$) {
        proxy_pass http://kunling_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /files/ {
        proxy_pass http://kunling_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v3/api-docs {
        proxy_pass http://kunling_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /doc.html {
        proxy_pass http://kunling_backend;
        proxy_set_header Host $host;
    }

    location /webjars/ {
        proxy_pass http://kunling_backend;
        proxy_set_header Host $host;
    }

    location /swagger-resources/ {
        proxy_pass http://kunling_backend;
        proxy_set_header Host $host;
    }

    location = /swagger-resources {
        proxy_pass http://kunling_backend;
        proxy_set_header Host $host;
    }

    # 源码目录可能包含 Git 元数据和本地开发代理，禁止作为静态资源对外暴露。
    location ~ /\. {
        deny all;
    }

    location = /workflow-api-proxy.mjs {
        return 404;
    }

    # 纯 HTML 多页面站点不存在前端路由回退，未知资源直接返回 404。
    location / {
        try_files $uri $uri/ =404;
    }
}
